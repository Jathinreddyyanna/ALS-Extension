version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: abs_dev
      POSTGRES_USER: abs
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/001_pg_trgm.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --requirepass devpassword

  api:
    build: ./backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://abs:devpassword@postgres:5432/abs_dev
      REDIS_URL: redis://:devpassword@redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NODE_ENV: development
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
